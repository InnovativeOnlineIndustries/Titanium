plugins {
  id 'java-library'
  id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
  id "com.modrinth.minotaur" version "2.9.0"
  id 'net.darkhax.curseforgegradle' version '1.3.33'
}

final mcVersion = "26.1.2"
version = mcVersion + "-" + api_version
group = modGroup

if (System.getenv('BUILD_NUMBER') != null) {
  version += "." + System.getenv('BUILD_NUMBER')
}

repositories {
    maven {
        name = "BlameJared maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = modBaseName
}

// Minecraft 26.1.2 ships with Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = "${neo_version}"

    runs {
        client {
            client()
        }
        server {
            server()
          programArgument '--nogui'
        }
    }

    mods {
        titanium {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
  compileOnly "mezz.jei:jei-${mcVersion}-common-api:$jei_version"
  compileOnly "mezz.jei:jei-${mcVersion}-neoforge-api:$jei_version"
  runtimeOnly "mezz.jei:jei-${mcVersion}-neoforge:$jei_version"
  //runtimeOnly "curse.maven:industrial-foregoing-266515:5866238"
  //runtimeOnly "curse.maven:functional-storage-556861:5861256"
  //runtimeOnly "curse.maven:super-factory-manager-306935:5664209"
  //implementation "curse.maven:refined-storage-243076:5165548"
}

jar {
  manifest {
    attributes(["Specification-Title"     : project.name,
                "Specification-Vendor"    : "Horizon Studio",
                "Specification-Version"   : "2.0",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.api_version + "." + System.getenv('BUILD_NUMBER')}",
                "Implementation-Vendor"   : "Horizon Studio",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "Maven-Artifact": "${group}:${base.archivesName.get()}:${version}",
                "ModSide"                 : "BOTH",
                "Automatic-Module-Name"   : "com.hrznstdio.titanium"
    ])

  }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
  options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-Xmaxwarns', '1000'])
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = modBaseName
      from components.java
    }
  }
  repositories {
    maven {
      url "file://" + System.getenv("local_maven")
    }
  }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
  apiToken = System.env["CURSE_API"]

  def mainFile = upload(287342, jar)
  mainFile.releaseType = 'beta'
  mainFile.changelog = 'https://github.com/InnovativeOnlineIndustries/Titanium/blob/26.1.2/CHANGELOG.md'
  mainFile.changelogType = 'markdown'
  mainFile.addModLoader("NeoForge")
  mainFile.addGameVersion("26.1.2")
  mainFile.addEnvironment("Client", "Server")
}

tasks.modrinth.enabled = System.env["MODRINTH_TOKEN"] != null

modrinth {
  token = System.getenv("MODRINTH_TOKEN")
  // This is the default. Remember to have the MODRINTH_TOKEN environment variable set or else this will fail, or set it to whatever you want - just make sure it stays private!
  projectId = "1Ro7m06l" // This can be the project ID or the slug. Either will work!
  versionType = "beta" // This is the default -- can also be `beta` or `alpha`
  uploadFile = jar // With Loom, this MUST be set to `remapJar` instead of `jar`!
  gameVersions = ["26.1.2"] // Must be an array, even with only one version
  loaders = ["neoforge"] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
  dependencies { // A special DSL for creating dependencies

  }
  changelog = "https://github.com/InnovativeOnlineIndustries/Titanium/blob/26.1.2/CHANGELOG.md"
}
